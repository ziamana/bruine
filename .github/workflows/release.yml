name: Release

# A tag `vX.Y.Z` on main publishes bruine X.Y.Z to npm and opens a GitHub release with that
# version's CHANGELOG section. Every installed bruine finds it within a day (the daily update
# check) and offers /update.
#
# Needs one repository secret: NPM_TOKEN, an npm automation token allowed to publish `bruine`.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag and package.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "tag v$tag but package.json says $version"; exit 1; fi
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release with this version's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "bruine $version" --notes-file notes.md
