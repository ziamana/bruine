# The kumo-code bundle patch: an interactive terminal agent over dsh-base.
# Inserts the kumo plugins (startup, repl, render, approval, web-search) and
# the extra tool rows. Cache rule (ARCHITECTURE section 0): the system prompt
# and the tools array are byte-identical all session long — modes are a
# kumo-side gate + appended messages, never a prompt/tool swap.

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are kumo, a terminal coding agent powered by {{model}}. Be short and
      direct: answer first, detail only when asked. Reply in the user's
      language. Never use emojis. Only mention tools you actually have.
    personaSuffix: Your working directory is {{cwd}}.

# kumo's own search provider (SearXNG / Brave / Tavily, configured in
# kumo.json; "none" by default). Never dsh-free-search. The provider registers
# itself with the `web` runtime lazily, so no gating is needed here.
- id: web
  config:
    searchProvider: kumo
    fetchProvider: http

# T26: kumo owns the USER skills root. Setup links/copies the chosen skills
# into $DSH_HOME/skills (dsh's dshHome root, unchanged), so repoint
# agentsHome at a kumo-owned empty directory: `~/.agents/skills` is no longer
# read implicitly. Project skills (`.agents/skills`, `.dsh/skills` in the
# workspace) keep working; `dshHomePath` resolves $DSH_HOME at boot, exactly
# like the dsh-base rows for sessions/storages.
- id: skill-filesystem
  config:
    agentsHome: !!js dshHomePath('agents')

# T16: safety comes from kumo's own gate, not dsh's sandbox — commands really
# run on the machine. The sandbox is left fully open; kumo's pre-tool gate is
# the only permission layer, so dsh escalation never fires.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# Pin approvals to "ask": when kumo's gate returns `ask`, the approval service
# must actually reach kumo-approval's select.
- id: approval
  config:
    policy: ask

# The presets service validates that the composed (sandbox, approval) pair
# matches a preset: kumo-ask = sandbox off + approvals reach kumo's select.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: kumo-ask
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read Only
        description: Files are read-only for tools.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace Edit
        description: Allow edits within the workspace.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: No Sandbox
        description: No sandbox.
      kumo-ask:
        sandbox: danger-full-access
        approval: ask
        name: kumo gate
        description: Sandbox off; kumo's own gate asks before risky actions.

# Keep the model-facing catalog fixed for each session. The launcher reads
# kumo.json before dsh starts; an absent tools setting selects lean.
- id: plan-mode
  disabled: !!js process.env.KUMO_TOOLS !== 'full'
- id: tool-subagent-control
  disabled: !!js process.env.KUMO_TOOLS !== 'full'
- id: tool-subagent-list-agents
  disabled: !!js process.env.KUMO_TOOLS !== 'full'
- id: tool-subagent-fork
  disabled: !!js process.env.KUMO_TOOLS !== 'full'
- id: tool-workflow
  disabled: !!js process.env.KUMO_TOOLS !== 'full'
- id: tool-goal
  disabled: !!js process.env.KUMO_TOOLS !== 'full'
- id: tool-ralph
  disabled: !!js process.env.KUMO_TOOLS !== 'full'

- insert:
    - id: kumo-startup
      name: 'kumo-code/startup'

    - id: kumo-repl
      name: 'kumo-code/repl'
      inject: [kumoStartup]

    - id: kumo-render
      name: 'kumo-code/render'

    - id: kumo-approval
      name: 'kumo-code/approval'

    - id: kumo-modes
      name: 'kumo-code/modes'

    - id: kumo-web-search
      name: 'kumo-code/web-search'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: tool-str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      disabled: !!js process.env.KUMO_TOOLS !== 'full'

    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
      disabled: !!js process.env.KUMO_TOOLS !== 'full'
